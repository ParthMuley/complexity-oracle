# Complexity Oracle — GCP Cloud Build CI/CD pipeline
#
# This is the PUBLIC SERVER configuration (bring-your-own-key).
# No ANTHROPIC_API_KEY is set — callers must pass X-Anthropic-API-Key header.
#
# Manual deploy (from your machine):
#   gcloud builds submit --config cloudbuild.yaml .
#   → uses tag "latest" by default
#
# CI deploy (from a Cloud Build GitHub trigger):
#   The trigger passes --substitutions=_IMAGE_TAG=$COMMIT_SHA automatically.
#   → uses the commit SHA as the image tag
#
# Prerequisites:
#   1. Enable APIs:
#      gcloud services enable cloudbuild.googleapis.com run.googleapis.com containerregistry.googleapis.com
#
#   2. Grant Cloud Build the Cloud Run Admin + Service Account User roles:
#      PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#      CB_SA="${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com"
#      gcloud projects add-iam-policy-binding $PROJECT_ID --member="serviceAccount:$CB_SA" --role="roles/run.admin"
#      gcloud projects add-iam-policy-binding $PROJECT_ID --member="serviceAccount:$CB_SA" --role="roles/iam.serviceAccountUser"

substitutions:
  _IMAGE_TAG: "latest"   # overridden by CI trigger with the commit SHA

steps:
  # Step 1 — Build and tag the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/complexity-oracle:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/complexity-oracle:latest'
      - '.'

  # Step 2 — Push versioned tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/complexity-oracle:${_IMAGE_TAG}'

  # Step 3 — Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/complexity-oracle:latest'

  # Step 4 — Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'complexity-oracle'
      - '--image=gcr.io/$PROJECT_ID/complexity-oracle:${_IMAGE_TAG}'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--set-env-vars=CLOUD_MODE=true,RATE_LIMIT=10/minute'
      # Note: ANTHROPIC_API_KEY is intentionally NOT set here.
      # Callers must supply their own key via X-Anthropic-API-Key header.

images:
  - 'gcr.io/$PROJECT_ID/complexity-oracle:${_IMAGE_TAG}'
  - 'gcr.io/$PROJECT_ID/complexity-oracle:latest'
