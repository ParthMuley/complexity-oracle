# Complexity Oracle — Railway deployment config
#
# This is the DEMO SERVER configuration.
# Set these env vars in the Railway dashboard:
#   ANTHROPIC_API_KEY = sk-ant-...    (your key — server pays for all requests)
#   CLOUD_MODE        = true           (disables subprocess profiling)
#   RATE_LIMIT        = 10/minute      (per-IP, protects against abuse)
#
# Deploy: railway up  (from project root)

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "uvicorn complexity_oracle.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
